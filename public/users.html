<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Users - CapitalFlowX Admin</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="/assets/css/style.css">
  <style>
    body{font-family:Arial,Helvetica,sans-serif;background:#f4f6f9;padding:24px}
    .card{background:#fff;padding:18px;border-radius:8px;box-shadow:0 6px 20px rgba(15,23,42,0.06)}
    table{width:100%;border-collapse:collapse}
    th,td{padding:10px;border-bottom:1px solid #eee;text-align:left}
    .btn{display:inline-block;padding:6px 10px;border-radius:6px;border:none;cursor:pointer}
  </style>
</head>
<body>
  <header style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px">
    <h1>Users</h1>
    <div>
      <button onclick="localStorage.removeItem('token');location.href='/login.html'">Logout</button>
    </div>
  </header>

  <div class="card">
    <h3>All Registered Users</h3>
    <table id="users-table">
      <thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Role</th><th>Join Date</th><th>Status</th></tr></thead>
      <tbody id="users-tbody"><tr><td colspan="6">Loading...</td></tr></tbody>
    </table>
  </div>

  <script>
    async function loadUsers() {
      const tbody = document.getElementById('users-tbody');
      const token = localStorage.getItem('token');
      if (!token) {
        location.href = '/login.html';
        return;
      }
      try {
        const res = await fetch('/api/users', { headers: { 'Authorization': 'Bearer ' + token }});
        const data = await res.json();
        if (!res.ok) {
          alert(data.error || 'Failed to load users');
          return;
        }
        const users = data.users || [];
        if (users.length === 0) {
          tbody.innerHTML = '<tr><td colspan="6">No users found</td></tr>';
          return;
        }
        tbody.innerHTML = users.map(u => `
          <tr>
            <td>${u.id}</td>
            <td>${u.name}</td>
            <td>${u.email}</td>
            <td>${u.role}</td>
            <td>${new Date(u.joinDate).toLocaleString()}</td>
            <td>${u.status}</td>
          </tr>
        `).join('');
      } catch (e) {
        console.error(e);
        tbody.innerHTML = '<tr><td colspan="6">Error loading users</td></tr>';
      }
    }
    document.addEventListener('DOMContentLoaded', loadUsers);
  </script>
  <script src="/js/auth.js"></script>
</body>
</html>
