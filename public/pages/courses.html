<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>My Courses — CapitalFlowX</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="styles.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; padding-top: 70px; }
    .card { border: none; border-radius: 0.75rem; box-shadow: 0 0.25rem 0.75rem rgba(0,0,0,0.05); }
    .nav-link.active { font-weight: bold; color: #007bff !important; }
    .course-thumb { height: 180px; object-fit: cover; border-radius: 0.5rem; }
  </style>
</head>
<body>
  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm fixed-top">
    <div class="container-fluid px-4">
      <a class="navbar-brand font-weight-bold text-primary" href="index.html">CapitalFlowX</a>
      <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navMain">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navMain">
        <ul class="navbar-nav ml-auto">
          <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link active" href="courses.html">My Courses</a></li>
          <li class="nav-item"><a class="nav-link" href="payments.html">Payments</a></li>
          <li class="nav-item"><a class="nav-link" href="profile.html">Profile</a></li>
          <li class="nav-item"><a class="nav-link" href="support.html">Support</a></li>
          <li class="nav-item"><a class="nav-link" href="#" onclick="logout()">Logout</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- PAGE HEADER -->
  <div class="container-fluid px-4 mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h3 class="mb-0">My Courses</h3>
      <span class="text-muted small">Logged in as <strong id="userName">User</strong></span>
    </div>

    <div class="row" id="courseGrid">
      <!-- Courses dynamically injected here -->
    </div>
  </div>

  <!-- FOOTER -->
  <footer class="py-4 bg-dark text-white text-center">
    <div class="container">
      <p class="mb-0 small">&copy; 2025 CapitalFlowX — All Rights Reserved</p>
    </div>
  </footer>

  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Active link highlight
    const currentPage = window.location.pathname.split("/").pop();
    document.querySelectorAll('.nav-link').forEach(link => {
      if(link.getAttribute('href') === currentPage){
        link.classList.add('active', 'font-weight-bold', 'text-primary');
      }
    });

    // Load user
    const user = JSON.parse(localStorage.getItem('user'));
    if(!user){ window.location.href = "login.html"; }
    document.getElementById('userName').innerText = user.name;

    // Simulated course data
    const courses = [
      { title: "Forex Fundamentals", img: "https://i.ibb.co/NVvWjKY/forex.jpg", plan: "Free", link: "https://youtube.com/@capitalflowx" },
      { title: "Copy Trading Mastery", img: "https://i.ibb.co/ZK2jRCt/trading.jpg", plan: "Pro", link: "https://youtube.com/@capitalflowx" },
      { title: "Stocks & Indices", img: "https://i.ibb.co/p4MNs8d/stocks.jpg", plan: "Pro", link: "https://youtube.com/@capitalflowx" },
      { title: "Crypto Strategies", img: "https://i.ibb.co/jfF2M1z/crypto.jpg", plan: "Elite", link: "https://youtube.com/@capitalflowx" }
    ];

    const grid = document.getElementById('courseGrid');
    courses.forEach(c => {
      const locked = (c.plan !== "Free" && user.plan !== c.plan && user.plan !== "Elite");
      const card = `
        <div class="col-md-3 mb-4">
          <div class="card h-100 text-center">
            <img src="${c.img}" class="course-thumb card-img-top" alt="${c.title}">
            <div class="card-body">
              <h6 class="card-title">${c.title}</h6>
              <p class="small text-muted mb-2">Plan: ${c.plan}</p>
              ${locked
                ? `<button class="btn btn-outline-secondary btn-sm" disabled>Locked</button>`
                : `<a href="${c.link}" target="_blank" class="btn btn-primary btn-sm">Open</a>`
              }
            </div>
          </div>
        </div>`;
      grid.insertAdjacentHTML('beforeend', card);
    });

    function logout(){
      localStorage.removeItem('user');
      window.location.href = "login.html";
    }
  </script>
</body>
</html>
